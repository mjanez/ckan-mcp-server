[project]
name = "ckan-mcp-server"
version = "1.0.0"
description = "MCP Server for CKAN Open Data Portals with advanced search, SQL queries and geospatial analysis"
authors = [
    {name = "mjanez", email = "96422458+mjanez@users.noreply.github.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["mcp", "ckan", "open-data", "geospatial", "data-catalog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp>=2.13.0",
    "ckanapi>=4.7",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# Note: gettext module is included in Python stdlib (no pip install needed)
# Only GNU gettext tools needed for compiling .po files (optional):
# Ubuntu/Debian: sudo apt-get install gettext
# macOS: brew install gettext
# Or use: python src/compile_translations.py (pure Python fallback)

[project.urls]
Homepage = "https://github.com/mjanez/ckan-mcp-server"
Documentation = "https://github.com/mjanez/ckan-mcp-server#readme"
Repository = "https://github.com/mjanez/ckan-mcp-server"
Issues = "https://github.com/mjanez/ckan-mcp-server/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
